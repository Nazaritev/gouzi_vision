# 2026-05-03 12:13 CST
# Purpose: lidar/Point-LIO-only pole route from the current measured Odometry
# poses in src/点位.txt. This file is for camera-free obstacle_manager tests.
# Rollback: use obstacle_waypoints.yaml or restore the previous pole route YAML.
#
# Notes:
# - Point 1 in src/点位.txt is the route start point.
# - Points 1-15 are all required arrival points.
# - The measured path is very close to the obstacles, so pass-through arrival is
#   disabled on every point. Keep tolerances conservative and retest clearance
#   before increasing speed.
# - Turn points use mode=6 direct step override:
#   left=-0.2/right=0.65 turns CCW, left=0.65/right=-0.2 turns CW.

waypoints:
  - name: pole_start
    x: 0.0229
    y: -0.0257
    yaw_deg: 0.1
    frame_id: camera_init
    mode_on_arrival: 6
    path_correction_profile_on_arrival: 1
    arrival_tolerance: 0.20
    use_yaw_tolerance: true
    yaw_tolerance_deg: 6.0
    allow_goal_pass_through: false
    smooth_transition: false
    post_arrival_pause_sec: 0.05
    note: "实测点1：启动点，到点后切 mode=6 开始绕杆。"

