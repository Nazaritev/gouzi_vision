# Nav2 navigation-only bringup for Point-LIO.
# 2026-05-01: Restored the old, proven Point-LIO Nav2 behavior:
# - Point-LIO still owns localization and publishes camera_init -> body.
# - mapping_mid360.launch.py provides body -> base_link as a static 90deg yaw transform.
# - Nav2 uses base_link, MPPI, SmacPlanner2D, and /cloud_registered obstacle layers.
# This file is launched by point_lio_ros2/mapping_mid360.launch.py by default.
# auto_nav_pkg/obstacle_race_bringup.launch.py can still start it with enable_nav2_bringup:=true for rollback.

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: camera_init
    robot_base_frame: base_link
    odom_topic: /Odometry
    # Old proven value: 50ms avoids BT tick-rate warnings on embedded CPUs.
    bt_loop_duration: 50
    default_server_timeout: 250
    wait_for_service_timeout: 5000
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
      movement_time_allowance: 12.0

    general_goal_checker:
      # 2026-05-02 rollback point: stateful=true 在连续近距离/远距离切点后偶发保留成功状态，
      # 造成下一目标刚发送就 SUCCEEDED。这里改为每个目标独立检查。
      # stateful: true
      stateful: false
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.10

    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      # Old proven controller timing: 10Hz control period with 0.10s MPPI model step.
      time_steps: 20
      model_dt: 0.10
      batch_size: 1000
      vx_std: 0.55
      vy_std: 0.0
      wz_std: 0.30
      vx_max: 1.50
      # Quadruped bridge approach is unsafe when MPPI chooses reverse motion.
      # Keep navigation forward-only; in-place yaw is still available via wz.
      vx_min: 0.0
      vy_max: 0.0
      vy_min: 0.0
      wz_max: 1.0
      iteration_count: 1
      prune_distance: 3.0
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.015
      motion_model: DiffDrive
      visualize: false
      critics:
        [
          ConstraintCritic,
          ObstaclesCritic,
          GoalCritic,
          GoalAngleCritic,
          PathAlignCritic,
          PathFollowCritic,
          PreferForwardCritic
        ]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.2
        critical_weight: 8.0
        consider_footprint: true

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        threshold_to_consider: 0.10

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.10

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.3
        offset_from_furthest: 20
        use_path_orientations: false

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 0.10

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 0.3
        threshold_to_consider: 0.20

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 15.0
      publish_frequency: 5.0
      global_frame: camera_init
      robot_base_frame: base_link
      transform_tolerance: 0.2
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      footprint: "[ [0.4, 0.35], [0.4, -0.35], [-0.4, -0.35], [-0.4, 0.35] ]"
      footprint_padding: 0.03
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: livox_cloud
        livox_cloud:
          topic: /cloud_registered
          data_type: PointCloud2
          expected_update_rate: 0.0
          observation_persistence: 0.0
          marking: true
          clearing: true
          min_obstacle_height: -0.2
          max_obstacle_height: 0.8
          obstacle_max_range: 6.0
          obstacle_min_range: 0.2
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 4.0
        inflation_radius: 0.4
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: camera_init
      robot_base_frame: base_link
      transform_tolerance: 0.5
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.05
      footprint: "[ [0.4, 0.35], [0.4, -0.35], [-0.4, -0.35], [-0.4, 0.35] ]"
      footprint_padding: 0.03
      track_unknown_space: false
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: livox_cloud
        livox_cloud:
          topic: /cloud_registered
          data_type: PointCloud2
          expected_update_rate: 0.0
          observation_persistence: 0.0
          marking: true
          clearing: true
          min_obstacle_height: -0.2
          max_obstacle_height: 0.8
          obstacle_max_range: 10.0
          obstacle_min_range: 0.2
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 4.0
        inflation_radius: 0.45
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 3.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner/SmacPlanner2D
      tolerance: 0.15
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      motion_model_for_search: 2D
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: camera_init
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 1.5
    max_rotational_vel: 1.2
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.8

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [1.2, 0.0, 1.2]
    # Match MPPI forward-only x velocity so the smoother cannot reintroduce reverse walking.
    min_velocity: [0.0, 0.0, -1.2]
    max_accel: [1.8, 0.0, 1.8]
    max_decel: [-0.4, 0.0, -1.8]
    odom_topic: /Odometry
    odom_duration: 0.2
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother

robot_state_publisher:
  ros__parameters:
    use_sim_time: false

nav2_controller:
  ros__parameters:
    use_sim_time: false

nav2_costmap_2d:
  ros__parameters:
    use_sim_time: false

nav2_planner:
  ros__parameters:
    use_sim_time: false
