orange_pole_relative_nav:
  ros__parameters:
    # 2026-07-16: direct motion-stage LiDAR slalom. P4 and the robot heading
    # create a fresh obstacle frame on every activation; no fixed camera_init
    # position is consumed. Set only lidar_slalom_enabled=false to return to
    # the unchanged AprilTag pre-align + 14-point controller.
    lidar_slalom_enabled: true
    lidar_slalom_topic: /livox/lidar
    lidar_slalom_cloud_window_frames: 7
    lidar_slalom_max_planar_range_m: 3.2
    lidar_slalom_lidar_to_body_translation_m: [-0.011, -0.02329, 0.04412]
    lidar_slalom_lock_timeout_sec: 1.50
    # Require three independent new cloud frames. The monitor timer must not
    # count the same rolling window twice after a transient bad P4 cluster.
    lidar_slalom_lock_samples: 3
    lidar_slalom_lock_consistency_m: 0.06
    lidar_slalom_fallback_to_legacy_before_motion: true
    lidar_slalom_pole_spacing_m: 1.0
    lidar_slalom_entry_forward_min_m: 0.45
    lidar_slalom_entry_forward_max_m: 1.30
    lidar_slalom_entry_lateral_max_m: 0.35
    lidar_slalom_vertical_z_min_m: -0.42
    lidar_slalom_vertical_z_max_m: 0.42
    lidar_slalom_vertical_cell_size_m: 0.04
    lidar_slalom_vertical_min_points: 5
    lidar_slalom_vertical_min_z_span_m: 0.18
    lidar_slalom_expected_search_radius_m: 0.20
    lidar_slalom_pose_cloud_max_skew_sec: 0.12
    lidar_slalom_cloud_stale_timeout_sec: 0.40
    # P4 must be locked before motion. Once RUNNING, the saved local path and
    # Odometry are sufficient, so transient raw-cloud loss must not stop it.
    lidar_slalom_runtime_cloud_stale_stop_enabled: false
    lidar_slalom_sample_spacing_m: 0.03
    lidar_slalom_lookahead_m: 0.20
    lidar_slalom_mode: 0
    lidar_slalom_cruise_norm: 0.42
    lidar_slalom_minimum_norm: 0.18
    lidar_slalom_heading_gain_norm_per_rad: 0.70
    lidar_slalom_max_delta_norm: 0.28
    lidar_slalom_slowdown_heading_deg: 35.0
    # Corrected measured footprint: 0.66m long x 0.46m wide. Runtime safety
    # uses the oriented rectangle-to-pole-surface distance, not center distance.
    lidar_slalom_robot_length_m: 0.66
    lidar_slalom_robot_width_m: 0.46
    lidar_slalom_pole_radius_m: 0.025
    # Field priority is route completion. Keep reporting clearance/cross-track
    # violations, but never switch to FAILED or command zero because of them.
    lidar_slalom_runtime_geometry_stop_enabled: false
    lidar_slalom_min_body_clearance_m: 0.04
    lidar_slalom_min_planned_body_clearance_m: 0.08
    lidar_slalom_max_cross_track_m: 0.28
    # Rule-book mandatory circles are 0.35m diameter; drive the body center
    # within 0.14m of each run-local zone center before allowing progress.
    lidar_slalom_mandatory_zone_tolerance_m: 0.14
    lidar_slalom_finish_distance_m: 0.16
    # Three field runs needed about 35s to approach the exit. Leave enough
    # watchdog time for the slow run and the terminal pose curve.
    lidar_slalom_route_timeout_sec: 50.0
    # The third mandatory-zone center is both the position endpoint and the
    # absolute-yaw endpoint. Replace the old tail from the last safe P1-side
    # control point with a cubic pose curve; there is no path after zone 3.
    lidar_slalom_final_absolute_yaw_enabled: true
    lidar_slalom_final_absolute_yaw_deg: 0.0
    lidar_slalom_final_absolute_yaw_tolerance_deg: 8.0
    lidar_slalom_final_curve_anchor_rl: [2.10, -0.45]
    lidar_slalom_final_curve_start_handle_m: 0.60
    lidar_slalom_final_curve_end_handle_m: 0.10
    lidar_slalom_final_curve_sample_spacing_m: 0.005
    lidar_slalom_final_curve_min_lookahead_m: 0.04
    lidar_slalom_final_curve_minimum_norm: 0.10
    lidar_slalom_final_curve_max_delta_norm: 0.38
    lidar_slalom_final_curve_yaw_blend_start: 0.80
    # Legacy rollback: set this true and final_absolute_yaw_enabled false.
    lidar_slalom_final_turn_enabled: false
    lidar_slalom_final_turn_delta_deg: 90.0
    # Parameters below are retained only for that legacy mode-6 rollback.
    lidar_slalom_final_turn_mode: 6
    lidar_slalom_final_turn_ccw_left_norm: -0.20
    lidar_slalom_final_turn_ccw_right_norm: 0.65
    lidar_slalom_final_turn_cw_left_norm: 0.65
    lidar_slalom_final_turn_cw_right_norm: -0.20
    lidar_slalom_final_turn_fine_error_deg: 12.0
    lidar_slalom_final_turn_fine_left_norm: -0.10
    lidar_slalom_final_turn_fine_right_norm: 0.35
    lidar_slalom_final_turn_tolerance_deg: 3.0
    # Finish on the first 90deg target crossing (or tolerance entry). Do not
    # wait for low yaw rate/hold, which caused mode-6 correction oscillation.
    lidar_slalom_final_turn_finish_immediately: true
    lidar_slalom_final_turn_max_yaw_rate_deg_s: 6.0
    lidar_slalom_final_turn_hold_sec: 0.20
    lidar_slalom_final_turn_timeout_sec: 12.0
    lidar_slalom_progress_log_interval_sec: 1.0
    # [row, leg] in the run-local frame: P3=(0,0), P4=(0,1), P2=(1,0),
    # P1=(2,0). The three explicit rule-zone centers are (0.4,1.4),
    # (-0.3,-0.3), and (2.4,0.4).
    lidar_slalom_template_points_rl:
      [0.40, 1.40, 0.45, 1.00, 0.34, 0.62, -0.22, 0.38,
       -0.42, 0.08, -0.30, -0.30, 0.10, -0.45, 0.42, -0.35,
       0.49, -0.15, 0.50, 0.12, 0.58, 0.35, 0.80, 0.45,
       1.12, 0.45, 1.45, 0.20, 1.50, 0.00,
       1.75, -0.35, 2.10, -0.45, 2.42, -0.18, 2.43, 0.12, 2.40, 0.40,
       2.70, 0.42]

    # 2026-07-16: shared trigger, pre-alignment, turn-stability, and fallback
    # parameters are synchronized with V4. V1 keeps only its independently
    # tuned route geometry, per-segment tracking gains, and arrival tolerances.
    goal_yaw_mode: waypoint
    first_forward_goal_yaw_mode: current
    first_forward_route_mode: 0
    forward_route_mode: 6
    turn_route_mode: 6
    route_reference_mode: locked_route_frame
    forward_tracking_enabled: true
    forward_tracking_base_left_norm: 0.5
    forward_tracking_base_right_norm: 0.5
    forward_tracking_lateral_gain: 0.04
    forward_tracking_lateral_gain_waypoint_indices:
    - 7
    - 9
    - 11
    - 13
    forward_tracking_lateral_gain_waypoint_values:
    - 0.18
    - 0.16
    - 0.24
    - 0.32
    forward_tracking_yaw_gain: 0.45
    forward_tracking_deadband_m: 0.02
    forward_tracking_max_delta_norm: 0.15
    forward_tracking_lateral_fail_m: 0.0
    forward_tracking_arrival_lateral_tolerance_waypoint_indices:
    - 7
    - 9
    - 11
    - 13
    forward_tracking_arrival_lateral_tolerance_waypoint_values:
    - 0.0
    - 0.0
    - 0.0
    - 0.0
    forward_tracking_yaw_fail_deg: 28.0
    forward_tracking_timeout_sec_per_m: 8.0
    forward_tracking_timeout_extra_sec: 3.0
    turn_settle_sec: 0.12
    turn_settle_yaw_tolerance_deg: 15.0
    turn_settle_yaw_unstable_fail_enabled: false
    progress_log_interval_sec: 2.0
    status_heartbeat_sec: 5.0
    trigger_source: apriltag
    use_trigger_topic: false
    trigger_from_nearest_topic: false
    stable_trigger_enabled: false
    apriltag_tf_topic: /tf
    apriltag_detections_topic: /apriltag/detections
    apriltag_target_frame_id: camera_color_optical_frame
    apriltag_target_child_frame_id: role
    apriltag_target_tag_id: 14
