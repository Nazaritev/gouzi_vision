apriltag_align_test:
  ros__parameters:
    tf_topic: "/tf"
    detections_topic: "/apriltag/detections"
    cmd_vel_topic: "/race_cmd_vel"
    pose_topic: "/Odometry"
    mode_topic: "/dog_mode_current"
    step_override_topic: "/serial_step_override"
    feedback_topic: "/apriltag_bridge_lateral_test/feedback_log"
    state_topic: "/apriltag_bridge_lateral_test/state"
    debug_topic: "/apriltag_bridge_lateral_test/debug"

    # tags_36h11.yaml maps id 15 to child_frame_id "bridge" with 135 mm size.
    target_frame_id: "camera_color_optical_frame"
    target_child_frame_id: "bridge"
    target_tag_id: 15

    # Fill this with the measured tag_x when the dog is on the bridge centerline.
    # Leave as .nan for dry runs; the node will refuse to move until set.
    target_tag_x_m: -0.433
    robot_center_offset_x_m: 0.0

    # Bridge test mode uses tag_x directly, not the normal waypoint flow.
    bridge_lateral_calibration_enabled: true
    bridge_lateral_deadband_m: 0.03
    bridge_lateral_hold_sec: 0.25
    bridge_lateral_forward_speed_mps: 0.05
    bridge_lateral_kp_radps_per_m: 1.50
    bridge_lateral_min_abs_angular_z: 0.02
    bridge_lateral_max_abs_angular_z: 0.16
    # Default bridge correction is turn-walk-turn: yaw out a little, walk a
    # short measured Odometry distance, then yaw back and re-check tag_x.
    bridge_lateral_control_strategy: "turn_walk_turn"
    bridge_lateral_twt_yaw_deg: 18.0
    bridge_lateral_twt_yaw_sign: -1.0
    bridge_lateral_twt_distance_scale: 1.0
    bridge_lateral_twt_min_distance_m: 0.03
    bridge_lateral_twt_max_distance_m: 0.35
    bridge_lateral_twt_distance_deadband_m: 0.01
    # Do not use tag_x while the body is yawed out; walk this Odometry distance
    # first, turn back, then re-check tag_x from the restored heading.
    bridge_lateral_twt_live_stop_enabled: false
    # Test mode default: run one fixed nudge, stop, and report the rechecked
    # tag_x. Raise this after confirming direction and distance are correct.
    bridge_lateral_twt_max_iterations: 1
    bridge_lateral_twt_forward_mode: 0
    bridge_lateral_twt_forward_left_norm: 0.12
    bridge_lateral_twt_forward_right_norm: 0.12

    # Fallback arc/cmd_vel sign only; used when bridge_lateral_control_strategy: "arc".
    bridge_lateral_control_sign: -1.0
    bridge_lateral_use_step_override: true
    bridge_lateral_step_override_mode: 0
    # tag_x < target_tag_x_m and tag_x > target_tag_x_m use these two fixed
    # differential step commands. Flip the two pairs if the dog arcs away.
    bridge_lateral_left_error_left_norm: -0.10
    bridge_lateral_left_error_right_norm: 0.15
    bridge_lateral_right_error_left_norm: 0.15
    bridge_lateral_right_error_right_norm: -0.10
    bridge_lateral_max_abs_error_m: 0.45
    bridge_lateral_finish_after_hold: true
    # Once tag_x has stayed inside the tolerance, keep that lateral result and
    # only restore yaw. This avoids lateral/yaw/lateral oscillation near bridge.
    bridge_lateral_lock_after_hold: true
    # The lateral arc can leave the dog yawed. Latch Odometry yaw before the
    # lateral correction, then do a slow final yaw-only straighten before DONE.
    # Use Odometry yaw when lidar/odometry is running; this restores the
    # pre-calibration body heading after the lateral arc.
    bridge_lateral_yaw_realign_enabled: true
    bridge_lateral_yaw_reference_source: "odom"
    bridge_lateral_yaw_deadband_deg: 3.0
    bridge_lateral_yaw_hold_sec: 0.20
    bridge_lateral_yaw_use_step_override: true
    bridge_lateral_yaw_turn_mode: 6
    bridge_lateral_yaw_cw_left_norm: 0.10
    bridge_lateral_yaw_cw_right_norm: -0.05
    bridge_lateral_yaw_ccw_left_norm: -0.05
    bridge_lateral_yaw_ccw_right_norm: 0.10

    # Keep motion disabled by default. Pass enable_control:=true and
    # enable_serial_bridge:=true only when the dog has clear space before bridge.
    enable_control: true
    control_output_mode: "hybrid"
    control_mode: 0
    control_rate_hz: 15.0
    publish_zero_when_idle: true
    publish_mode_when_control_enabled: true
    mode_publish_interval_sec: 1.0

    # Standard AprilTag safety gates.
    alignment_mode: "center_x_offset"
    target_offset_x_m: 0.0
    target_center_angle_deg: 0.0
    max_abs_error_deg: 90.0
    min_distance_m: 0.15
    max_distance_m: 3.00
    stale_timeout_sec: 0.60
    pose_stale_timeout_sec: 0.80
    log_interval_sec: 0.20
    warn_interval_sec: 0.80

    # Disabled here so this test only evaluates bridge-entry lateral correction.
    enable_forward_approach: false
    lateral_shift_sequence_enabled: false
    lock_reference_on_tag_loss: false
    limit_bar_duck_sequence_enabled: false

    # Present for compatibility with the shared apriltag_align_test node.
    yaw_deadband_deg: 1.5
    yaw_kp: 0.90
    min_abs_angular_z: 0.04
    max_abs_angular_z: 0.20
    step_override_clear_mode: -1
    step_override_forward_mode: 0
    step_override_forward_left_norm: 0.35
    step_override_forward_right_norm: 0.35
    near_approach_use_cmd_vel: true
    near_approach_distance_error_m: 0.18
