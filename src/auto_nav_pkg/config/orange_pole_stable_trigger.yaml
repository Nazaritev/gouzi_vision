orange_pole_relative_nav:
  ros__parameters:
    # 2026-05-05:
    # Stable-trigger overlay for the separate orange_pole_relative_nav_stable_node.
    # This file only changes trigger behavior. Route geometry still comes from
    # obstacle_race_system.yaml + the selected body-relative route YAML.
    stable_trigger_enabled: true

    # Use a short recent history so trigger stabilizes quickly enough for race use.
    stable_trigger_window_size: 5
    stable_trigger_min_samples: 3
    stable_trigger_max_sample_age_sec: 0.45

    # Trigger only when the recent pole-distance estimate is both inside the
    # trigger range and not jumping too much frame to frame.
    stable_trigger_distance_spread_max_m: 0.08
    stable_trigger_lateral_spread_max_m: 0.08
    stable_trigger_median_distance_margin_m: 0.00

    # Do not wait too long. If the signal never becomes "stable enough",
    # optionally fall back to the old immediate trigger after this timeout.
    stable_trigger_arm_timeout_sec: 0.35
    stable_trigger_timeout_fallback_to_immediate: true

    # Trigger as soon as the signal is stable enough, but keep only a very small
    # controlled forward step during this short window. Some hardware gaits do
    # not hold position well at exact zero and may drift backward, so use a
    # small crawl and let Odometry compensation absorb the motion.
    stable_trigger_hold_override_enabled: true
    stable_trigger_hold_mode: 0
    stable_trigger_hold_left_norm: 0.18
    stable_trigger_hold_right_norm: 0.18

    # If the body still drifts slightly during the stable-trigger window, use
    # Odometry displacement to compensate the apparent depth/lateral change and
    # keep the trigger decision anchored to the armed pose.
    stable_trigger_compensate_pose_drift: true
    stable_trigger_use_armed_pose_as_anchor: true
