obstacle_race_supervisor:
  ros__parameters:
    pose_topic: "/Odometry"
    # supervisor 的楼梯后 yaw 对齐/固定前进必须使用最新 Odometry；若回调停更，
    # 保持停止等待，避免用起步旧位姿直接判定对齐完成。Point-LIO/调度偶发
    # >0.75s 间隔，窗口放宽到 5s；真正停更时仍不会使用起步旧位姿。
    pose_stale_timeout_sec: 5.0
    step_override_topic: "/serial_step_override"
    step_once_topic: "/serial_step_once"
    state_topic: "/obstacle_race_supervisor/state"
    feedback_topic: "/obstacle_race_supervisor/feedback_log"
    # visual launch 会把当前选择的 obstacle_waypoints*.yaml 传进来；
    # 这里保留空值，避免直接加载本文件时意外启用砂坑绕行。
    sandpit_bypass_file: ""
    apriltag_tf_topic: "/tf"
    # /tf is shared with high-rate odometry transforms. Keep the standard
    # dynamic-TF depth so short AprilTag bursts are not overwritten before the
    # single-threaded supervisor callback can consume them.
    apriltag_tf_queue_depth: 100

    limit_trigger_topic: "/limit_bar_duck_test/trigger"
    limit_nearest_topic: "/limit_bar_duck_test/nearest"
    hurdle_trigger_topic: "/orange_hurdle_jump_test/trigger"
    hurdle_nearest_topic: "/orange_hurdle_jump_test/nearest"
    pole_trigger_topic: "/orange_pole_detector/trigger"
    pole_nearest_topic: "/orange_pole_detector/nearest"
    slope_trigger_topic: "/slope_branch_detector/trigger"
    slope_nearest_topic: "/slope_branch_detector/nearest"
    upstairs_trigger_topic: "/upstairs_detector/trigger"
    upstairs_nearest_topic: "/upstairs_detector/nearest"

    stairs_active_topic: "/obstacle_supervisor/stairs_active"
    stairs_state_topic: "/stairs_manager/state"
    slope_active_topic: "/obstacle_supervisor/slope_active"
    slope_state_topic: "/slope_manager/state"
    slope_current_waypoint_topic: "/slope_manager/current_waypoint"
    slope_retry_restart_from_waypoint_topic: "/slope_manager/restart_from_waypoint"
    slope_route_yaw_reference_topic: "/slope_route_yaw_reference"
    slope_bridge_retry_yaw_reference_topic: "/slope_bridge_retry_yaw_reference"
    # 将斜坡桥前人工重锁的赛道 0deg 应用于后续固定绝对角。
    # 总回退：downstream_route_yaw_reference_enabled=false。
    # 分支回退：关闭对应 downstream_route_yaw_*_enabled；未收到基准时自动沿用原绝对角。
    downstream_route_yaw_reference_enabled: true
    downstream_route_yaw_reference_timeout_sec: 0.0
    downstream_route_yaw_hurdle_enabled: true
    downstream_route_yaw_upstairs_enabled: true
    downstream_route_yaw_limit_bar_pre_duck_enabled: true
    pole_active_topic: "/orange_pole_relative_nav/active"
    pole_state_topic: "/orange_pole_relative_nav/state"
    pole_feedback_topic: "/orange_pole_relative_nav/feedback_log"

    start_with_stairs_manager: true
    wait_for_start_signal: true
    start_signal_topic: "/motion_bridge/start_signal"
    start_retry_guard_sec: 5.0  # 首次 start 启动后，此时间内重复 start 直接忽略
    action_ack_topic: "/motion_bridge/action_ack"
    serial_connected_topic: "/motion_bridge/serial_connected"
    start_wait_mode: 0
    start_wait_left_norm: 0.0
    start_wait_right_norm: 0.0
    search_publish_hz: 30.0
    search_mode: 0  #搜索的行走状态
    search_left_norm: 0.5
    search_right_norm: 0.5
    # 放宽扫码进入：限高杆 tag 样本窗口原本只有 0.5s，0.8s rearm 会让刚看到的 TF 过期。
    search_rearm_delay_sec: 0.3
    search_yaw_correction_enabled: true
    search_yaw_use_startup_yaw: true
    search_yaw_target_deg: 0.0
    search_yaw_tolerance_deg: 2.0
    search_yaw_gain_per_rad: 0.35
    search_yaw_max_delta_norm: 0.40
    search_yaw_log_interval_sec: 1.0
    detection_stale_timeout_sec: 0.75
    limit_trigger_min_duration_sec: 0.15  # 限高杆要稳定一小段，过滤背景蓝白块的一拍毛刺
    hurdle_trigger_min_duration_sec: 0.20 # 斜坡入口处橘色前景会短暂像横栏，横栏必须持续更久再抢分支
    slope_trigger_min_duration_sec: 0.30  # 斜坡只要稳定半拍就放行，别等太久错过短脉冲
    pole_visual_trigger_enabled: false    # 禁止旧 HSV 视野触发绕杆；总控只用 AprilTag 14 进绕杆
    pole_trigger_min_duration_sec: 0.35   # 仅在 pole_visual_trigger_enabled=true 时生效
    # 收到电控第二次及后续 [start] 时作为 retry：
    # - 普通分支回 SEARCH
    # - 绕杆分支累计失败次数；达到阈值后下一次绕杆触发改走对应绕杆 YAML 里的 pole_bypass
    pole_retry_failures_before_bypass: 2

    pole_bypass_enabled: true
    pole_bypass_force_on_detection: false
    pole_bypass_pre_bypass_waypoints: 0
    pole_bypass_complete_once: true
    pole_bypass_search_rearm_delay_sec: 0.8
    # 上台阶 detector 自己已经按颜色/深度筛选并有 trigger_hold_sec；
    # supervisor 这里不再额外等待，避免绿色台阶先被 slope_detector 抢进斜坡分支。
    upstairs_trigger_min_duration_sec: 0.0
    # 与 upstairs_detector trigger_distance_m 对齐；相对上一版 0.620m 向前 1cm。
    upstairs_trigger_distance_m: 0.610
    # 2026-07-06: 上台阶入口改用 AprilTag 18（110mm）。流程复用高墙:
    # 搜索态先在较远距离锁定 tag/yaw，对齐和横向补偿后，再按原上台阶距离发 step_once。
    upstairs_tag_trigger_enabled: true
    upstairs_tag_target_tag_id: 18
    upstairs_tag_frame_id: "camera_color_optical_frame"
    upstairs_tag_child_frame_id: "upstairs"
    # 现场标定直接使用首次锁存的 tag_x 作为横移量；不再叠加旧的 -0.36m
    # 中心偏置，否则 tag_x 约 -0.22m 会被放大成约 -0.58m。
    upstairs_tag_to_center_x_m: -0.31
    upstairs_tag_stale_timeout_sec: 0.60
    upstairs_tag_min_samples: 1
    upstairs_tag_max_sample_age_sec: 0.50
    upstairs_tag_trigger_distance_m: 1.70
    # Primary path still requires the AprilTag TF and performs full yaw/lateral
    # alignment. If ID18 was seen recently but its /tf sample was dropped, the
    # old close-range upstairs detector may stop blind forward search and send
    # step_once after the high-wall branch has completed.
    upstairs_tag_visual_fallback_enabled: true
    upstairs_tag_visual_fallback_require_hurdle_completed: true
    # 近距离视觉兜底不再强依赖最近看到 ID18：现场有图像和 trigger=True，
    # 但 ID18 TF 长时间缺失时，继续搜索会顶到台阶。
    upstairs_tag_visual_fallback_require_recent_tag_id: false
    upstairs_tag_visual_fallback_max_detection_age_sec: 2.0
    upstairs_tag_odom_handoff_enabled: true
    upstairs_tag_odom_handoff_timeout_sec: 2.0
    upstairs_tag_odom_handoff_max_start_distance_m: 1.85
    upstairs_tag_slope_guard_enabled: true
    upstairs_tag_slope_guard_distance_m: 1.85
    # 上台阶标称角为 0deg；收到运行时赛道 0deg 后使用 route_zero+0deg。
    # Tag 负责触发、距离和横向锁存；航向预对齐后优先使用转正后的新鲜 Tag，丢码时按 yaw
    # 变化旋转初始 x/z，避免把转向前的相机横向量误当成场地横向误差。
    upstairs_tag_yaw_reference_mode: "fixed_absolute"
    upstairs_tag_fixed_reference_yaw_deg: 0.0
    # 兼容旧模式的开关；fixed_absolute 模式下不会读取该值生成 yaw。
    upstairs_tag_yaw_align_from_lateral_enabled: false
    # 预对齐、横移基准、横移后回正和最终前进使用同一个解析后目标角。
    upstairs_lateral_pre_align_enabled: true
    upstairs_lateral_pre_align_mode: "fixed_absolute_yaw"
    upstairs_lateral_pre_align_use_visual_feedback: false
    upstairs_lateral_pre_align_timeout_sec: 8.0
    upstairs_lateral_pre_align_max_visual_error_deg: 0.0
    upstairs_lateral_pre_align_hold_sec: 0.10
    upstairs_lateral_pre_align_tolerance_deg: 1.0
    upstairs_lateral_pre_align_pose_control_sign: -1.0
    upstairs_lateral_pre_align_target_pose_pitch_deg: 0.0
    upstairs_lateral_shift_yaw_deg: 90.0
    # 实测 center_x<0 时走 -90deg 会越修越偏；上台阶横移方向保持限高杆同向。
    upstairs_lateral_shift_yaw_sign: -1.0
    # 上台阶独立缩放首次锁定的横向误差，避免复用限高杆 1.00 时横移过量。
    upstairs_lateral_shift_distance_scale: 0.80
    # 2026-07-16: 相对上一版 0.520m 规划目标向前 1cm。
    upstairs_lateral_shift_target_distance_m: 0.510
    # 最终前进按 0.510m 规划，只允许 5cm 里程容差；不得复用 12cm 横移死区。
    upstairs_final_forward_tolerance_m: 0.05
    # 新鲜 Tag 存在时完成线为 target+0.05=0.560m。
    upstairs_final_tag_distance_tolerance_m: 0.05
    # Tag 丢失时视觉完成线与 Tag 完成线对齐。
    upstairs_final_visual_distance_m: 0.560
    # 最后 0.25m 降到 0.30 步长，减少检测/控制延迟期间约 7-8cm 的前冲。
    upstairs_final_slowdown_distance_m: 0.25
    upstairs_final_slow_walk_left_norm: 0.30
    upstairs_final_slow_walk_right_norm: 0.30
    # 里程先到线而距离检测仍偏远时，不再原地停等；用很小步长前探到距离确认。
    # 最大额外前探 0.18m，防止视觉长期丢失时无限前进。
    upstairs_final_confirm_creep_max_extra_m: 0.18
    upstairs_final_confirm_creep_left_norm: 0.15
    upstairs_final_confirm_creep_right_norm: 0.15
    # 本次基本居中样本仍测得 tag_x=-0.096m；若只设 6cm 死区，会为不足
    # 10cm 的偏差执行完整 90deg 转向横移流程。横偏 <=12cm 时直接视为居中。
    upstairs_lateral_shift_deadband_m: 0.12
    # 到达容差不再复用 12cm 触发死区；回退旧行为时改回 0.12。
    upstairs_lateral_shift_arrival_tolerance_m: 0.04
    # 右侧 tag 正常换算横移约 0.17-0.22m；即使姿态离群也禁止生成 0.6m 级横移。
    upstairs_lateral_shift_max_distance_m: 0.25
    # 上台阶只使用初次锁定的 tag 基准；运动抖动会放大 live tag 偏差，默认不复核重锁。
    upstairs_lateral_shift_live_check_enabled: false
    upstairs_lateral_shift_live_check_center_gate_m: 0.10
    upstairs_lateral_shift_live_check_yaw_gate_deg: 5.0
    upstairs_lateral_shift_live_check_max_replans: 1
    # final_forward 阶段不再叠加 live tag yaw 修正，避免运动中 tag 抖动把车身角度拉偏。
    upstairs_final_forward_tag_yaw_correction_enabled: false
    upstairs_final_forward_tag_yaw_deadband_deg: 1.5
    upstairs_final_forward_tag_yaw_gain_norm_per_rad: 0.45
    upstairs_final_forward_tag_yaw_max_delta_norm: 0.10
    # 小于该误差时保持前进差速修正，不切换原地 mode=6，避免步态响应滞后
    # 在 6deg 左右反复过零；只有明显偏航才停下柔和回正。
    upstairs_final_forward_realign_gate_deg: 15.0
    # final_forward 到终点时，yaw 误差在 1deg 内直接 step_once，不再停等二次对齐。
    upstairs_final_yaw_complete_gate_deg: 1.0
    # AprilTag 18 是上台阶专用入口，tag 流程不再依赖高墙完成标志；
    # 该开关仅作为旧视觉 upstairs_detector 的保护门槛。
    upstairs_require_hurdle_completed: false
    # 绿色上台阶会被 slope_detector 当成斜坡。若 upstairs_detector 已经看到
    # 近处台阶候选但还没到正式触发距离，先禁止斜坡抢分支，继续向前等上台阶触发。
    upstairs_slope_guard_enabled: true
    upstairs_slope_guard_distance_m: 1.50
    # slope_detector 可能比 upstairs_detector 先出一帧 trigger；斜坡 ready 后先短暂等
    # upstairs nearest，避免还没收到第一帧上台阶候选就误进斜坡木桥。
    slope_wait_for_upstairs_nearest_sec: 0.20
    # 上台阶触发后 [5,0,0] 仍只通过 /serial_step_once 发一次。
    # 流程进入 DONE 后，先持续 30s 发布 [0,0.1,0.1] 小前进；这段保护期内收到
    # [start] 会把 upstairs_completed 清回 false 并返回 SEARCH，允许再次进入上台阶。
    # 30s 结束后恢复 [0,0,0]，继续覆盖旧 nav/slope_manager 输出。
    done_hold_step_override_enabled: true
    done_hold_mode: 0
    done_hold_left_norm: 0.0
    done_hold_right_norm: 0.0
    upstairs_done_retry_guard_enabled: true
    upstairs_done_retry_guard_duration_sec: 30.0
    upstairs_done_retry_guard_mode: 0
    upstairs_done_retry_guard_left_norm: 0.1
    upstairs_done_retry_guard_right_norm: 0.1
    # 任一流程进入 FAILED 后持续保持零步长，并停止 nav_executor 的旧目标。
    # 防止清除 override 后，仍为 active 的旧 /goal_pose 重新接管运动。
    failed_hold_step_override_enabled: true
    failed_stop_nav_executor_enabled: true
    failed_hold_mode: 0
    failed_hold_left_norm: 0.0
    failed_hold_right_norm: 0.0
    pole_max_lateral_abs_m: 0.25          # 杆必须接近画面/机身正前方；斜坡后左上角误检 lateral 约 0.30m 会被过滤
    pole_after_slope_search_delay_sec: 1.50  # 斜坡完成刚回搜索时，短暂不接受绕杆触发，避免坡面/边缘误判
    # 绕杆入口优先用 AprilTag 14 直接触发总控，避免先等 HSV 橘杆稳定后 tag 已经出画面。
    # 这里要和 orange_pole_body_relative_test_v4.yaml 的 AprilTag 配置保持一致。
    pole_apriltag_trigger_enabled: true
    pole_apriltag_target_tag_id: 14
    pole_apriltag_frame_id: "camera_color_optical_frame"
    pole_apriltag_child_frame_id: "role"
    pole_apriltag_stale_timeout_sec: 1.00
    # ID14 偶发空帧时保持最近一次命中，避免 detection 与 TF 回调错过同一控制周期。
    pole_apriltag_detection_latch_sec: 0.70
    pole_apriltag_require_tf: true
    pole_apriltag_min_duration_sec: 0.0
    pole_apriltag_distance_axis: "z"
    # 锁存期间仍要求最新 TF 的前向距离进入该门槛，避免远距离误触发。
    pole_apriltag_trigger_distance_m: 1.00
    # 远距离只扫到一次 ID14 时，锁存该次 tag_z 与 Odometry；后续若有新鲜 TF，
    # 自动用新测量覆盖锁存。锁存时把 Tag 转换到 Odometry 固定坐标，因此即使
    # ID14 是在沙坑阶段扫到、机器人随后发生转向，进入 SEARCH 后仍可估算当前
    # Tag 距离；估算进入 1.0m 触发线后才允许切入绕杆。
    pole_apriltag_odom_handoff_enabled: true
    pole_apriltag_odom_handoff_timeout_sec: 20.0
    pole_apriltag_odom_handoff_max_start_distance_m: 2.0
    # 搜索态下如果限高杆和绕杆同时触发，旧逻辑会让限高杆优先。
    # 但绕杆已经很近时（当前日志约 0.41m），应优先进入绕杆，避免宽横向背景候选抢走分支。
    pole_near_preempts_limit_bar: true
    pole_near_preempt_limit_bar_distance_m: 0.65
    # 固定入口处若低杆在前、斜坡在后，斜坡 mask 可能先触发；只要限高杆 detector
    # 已经给出新鲜 nearest，就让限高杆提前压过斜坡，不必等到自身 0.80m trigger。
    # 但楼梯后固定入口搜索阶段另有 post_stairs_slope_priority_enabled，
    # 一旦斜坡视觉/roll 已确认上坡，会先走斜坡，不再被这里抢走。
    # rollback: limit_bar_nearest_preempts_slope=false。
    limit_bar_nearest_preempts_slope: true
    limit_bar_nearest_preempt_distance_m: 0.90
    # 新版限高杆入口：用右侧 AprilTag 触发并走 tag 中心线流程。
    # 旧蓝白杆检测仍保留节点和 topic，但 supervisor 默认不再用它进入限高杆。
    # rollback: limit_bar_visual_trigger_enabled=true, limit_bar_tag_trigger_enabled=false。
    limit_bar_visual_trigger_enabled: false
    limit_bar_tag_trigger_enabled: true
    limit_bar_tag_target_tag_id: 12
    apriltag_detections_topic: "/apriltag/detections"
    # 限高杆右侧边缘 AprilTag 对中：
    # - tag 只用于趴下前计算通行中心线和 yaw；趴下/靠近后允许丢 tag。
    # - ROS optical frame 通常 x 向右、z 向前；tag 在右侧时中心线在 tag 左侧，
    #   因此 limit_bar_tag_to_center_x_m 通常为负。
    # Standalone AprilTag-centerline test 已验证，正式限高杆分支启用该路径。
    # rollback: limit_bar_tag_align_enabled=false, duck_centerline_correction_enabled=false。
    limit_bar_tag_align_enabled: true
    limit_bar_tag_frame_id: "camera_color_optical_frame"
    limit_bar_tag_child_frame_id: "limit_bar_right"
    # 2026-07-03: 实测机器人仍在中心线右侧，按 tag 到通行中心再向左补 0.10m。
    limit_bar_tag_to_center_x_m: -0.460
    # 触发时至少收齐 3 帧；几何锁定从最近 3 帧中选 abs(center_x) 最小的一帧。
    limit_bar_tag_stale_timeout_sec: 0.90
    limit_bar_tag_min_samples: 1
    limit_bar_tag_max_sample_age_sec: 0.80
    limit_bar_tag_geometry_lock_enabled: true
    limit_bar_tag_geometry_lock_sample_count: 3
    # 该值是“允许进入”的上限，不是假定可用规划距离；实际场地首次看到 ID12
    # 约为 1.0-1.1m，因此保留 1.40m 让首帧立即接管，路线仍按实测 tag_z 计算。
    limit_bar_tag_trigger_distance_m: 1.40
    # tag 在 1.30m 触发线外可见、随后前进丢 TF 时，锁存可见瞬间的 tag/里程计状态，
    # 用 odom 前进量估算剩余 tag_z，避免“1 帧已满足但前进后丢码”导致分支进不去。
    limit_bar_tag_odom_handoff_enabled: true
    limit_bar_tag_odom_handoff_timeout_sec: 2.0
    limit_bar_tag_odom_handoff_max_start_distance_m: 1.85
    # SEARCH 前如果提前看到 ID12，先锁存 tag + odom 起点；
    # 进入 SEARCH 后若有新鲜 ID12 样本，会用 SEARCH 内样本覆盖该锁存。
    limit_bar_tag_presearch_handoff_enabled: true
    # 机身在坡面/倾斜时提前锁存会放大 tag_x/tag_z 误差；超出该倾角则跳过预锁存。
    limit_bar_tag_presearch_handoff_max_abs_roll_deg: 30.0
    limit_bar_tag_presearch_handoff_max_abs_pitch_deg: 30.0
    # tag 已可见但还没进入 1.70m 触发线时，禁止斜坡/斜坡 fallback 抢分支。
    # 否则会先进入旧的“斜坡前 yaw 对齐”，表现为左右摆动后超时。
    limit_bar_tag_slope_guard_enabled: true
    limit_bar_tag_slope_guard_distance_m: 1.85
    limit_bar_tag_align_tolerance_deg: 2.0
    limit_bar_tag_align_timeout_sec: 4.0
    # Tag 继续用于触发、距离和横向中心线；yaw 改用锁定的全局/赛道基准角。
    # rollback: tag_lateral 恢复按 center_x/tag_z 计算 yaw。
    limit_bar_tag_yaw_reference_mode: "fixed_absolute"
    limit_bar_tag_fixed_reference_yaw_deg: 180.0
    # 仅保留旧 Tag 横向 yaw 方向参数，切回 tag_lateral 时生效。
    limit_bar_tag_align_yaw_offset_sign: -1.0
    limit_bar_tag_align_mode: 6
    # 旋转会带来横向漂移；限高杆前 tag/yaw 对齐使用较小反向步长。
    limit_bar_tag_align_ccw_left_norm: -0.15
    limit_bar_tag_align_ccw_right_norm: 0.20
    limit_bar_tag_align_cw_left_norm: 0.20
    limit_bar_tag_align_cw_right_norm: -0.15
    limit_bar_tag_align_turn_scale_enabled: true
    limit_bar_tag_align_turn_min_scale: 0.35
    limit_bar_tag_align_yaw_gain_per_rad: 0.58
    limit_bar_tag_align_min_abs_angular_z: 0.035
    limit_bar_tag_align_max_abs_angular_z: 0.18
    # 第一阶段旧路线提速：保留 90deg-横移-90deg 几何，只在大角度提高步长，
    # 接近目标时按 Odometry yaw 速度提前制动，并要求低角速度稳定后换阶段。
    # 总回退：limit_bar_lateral_precision_turn_enabled=false。
    limit_bar_lateral_precision_turn_enabled: true
    limit_bar_lateral_turn_far_error_deg: 35.0
    limit_bar_lateral_turn_far_scale: 1.25
    limit_bar_lateral_turn_yaw_damping_sec: 0.18
    limit_bar_lateral_turn_brake_yaw_rate_deg_s: 12.0
    limit_bar_lateral_turn_complete_yaw_rate_deg_s: 6.0
    # yaw_rate 使用 0.30s 窗口内解缠 yaw 的线性拟合；raw 只保留在日志中，
    # 不再让单帧回调抖动直接触发制动。alpha=1 表示直接使用窗口拟合结果。
    limit_bar_lateral_turn_yaw_rate_filter_alpha: 1.0
    limit_bar_lateral_turn_yaw_rate_window_sec: 0.30
    limit_bar_lateral_turn_yaw_rate_min_span_sec: 0.18
    limit_bar_lateral_turn_yaw_rate_max_abs_deg_s: 90.0
    limit_bar_lateral_turn_hold_sec: 0.12
    limit_bar_lateral_turn_reverse_cooldown_sec: 0.20
    # 每阶段独立看门狗；设为 0 可逐项关闭并恢复旧的无限等待行为。
    limit_bar_lateral_turn_timeout_sec: 8.0
    # 到达 yaw 容差但滤波角速度尚未降至阈值时，限高杆额外等待稳定。
    # rollback: 0.0。
    limit_bar_lateral_turn_timeout_settle_grace_sec: 0.60
    limit_bar_lateral_shift_timeout_sec: 4.0
    limit_bar_lateral_final_forward_timeout_sec: 12.0
    # 高墙和上台阶实测完成后，开始限高杆 S 曲线首轮实际测试。
    # 任一分支控制开关关闭或规划不可行时，自动回退旧 90deg 流程。
    lateral_s_curve_shadow_enabled: true
    hurdle_lateral_s_curve_shadow_enabled: true
    limit_bar_lateral_s_curve_shadow_enabled: true
    upstairs_lateral_s_curve_shadow_enabled: true
    lateral_s_curve_shadow_min_forward_m: 0.35
    lateral_s_curve_shadow_max_abs_lateral_m: 0.45
    # 高墙和上台阶保持 30deg/2.5m^-1；限高杆因有效前进距离短，单独放宽
    # 到 42deg/3.5m^-1。实测 0.604m/+0.200m 路线峰值为 31.8deg/2.90m^-1，
    # 旧共用 2.5m^-1 会错误回退 90deg 流程。
    # rollback: heading=30.0，curvature=2.5。
    lateral_s_curve_shadow_max_heading_deg: 30.0
    limit_bar_lateral_s_curve_max_heading_deg: 42.0
    lateral_s_curve_shadow_max_curvature_m_inv: 2.5
    limit_bar_lateral_s_curve_max_curvature_m_inv: 3.5
    lateral_s_curve_control_enabled: true
    hurdle_lateral_s_curve_control_enabled: true
    # rollback: false，单独恢复限高杆旧 90deg-横移-90deg 流程。
    limit_bar_lateral_s_curve_control_enabled: true
    # 实际 tag_z 只有 1.0-1.1m，同时保留 0.50m 趴下前距离；采用保守速度和
    # 限高杆独立 3.5/m 曲率上限。42deg 之外仍自动回退旧流程。
    limit_bar_lateral_s_curve_control_cruise_left_norm: 0.32
    limit_bar_lateral_s_curve_control_cruise_right_norm: 0.32
    limit_bar_lateral_s_curve_control_slow_left_norm: 0.20
    limit_bar_lateral_s_curve_control_slow_right_norm: 0.20
    limit_bar_lateral_s_curve_control_slowdown_distance_m: 0.18
    limit_bar_lateral_s_curve_control_timeout_sec: 8.0
    # 现场优先保证限高杆流程完成：过冲/超时锁存完成，横向及收尾超限只记录，
    # 不进入 FAILED。基础状态或 Odometry 不可用仍失败。rollback: false。
    limit_bar_lateral_s_curve_fail_open_enabled: true
    limit_bar_lateral_s_curve_control_max_forward_overshoot_m: 0.08
    limit_bar_lateral_s_curve_control_max_abs_cross_track_m: 0.12
    limit_bar_lateral_s_curve_control_forward_tolerance_m: 0.03
    limit_bar_lateral_s_curve_control_lateral_tolerance_m: 0.05
    limit_bar_lateral_s_curve_control_arrival_settle_sec: 0.20
    # 终点前先零速释放步态惯性；distance=0 可回退为不预停。
    limit_bar_lateral_s_curve_control_pre_stop_distance_m: 0.12
    limit_bar_lateral_s_curve_control_pre_stop_hold_sec: 0.20
    # 前向已到时允许按最终 8cm 横向保护锁存完成，不再为满足上面的 5cm
    # 跟踪精度继续 endpoint_correction 向前走。fail-open 开启时，到达后的
    # 绝对横向误差和横漂仅记录并保持零速，不再触发失败。
    # rollback: fail_open=false，final_abs 恢复 0.05。
    limit_bar_lateral_s_curve_control_final_abs_lateral_tolerance_m: 0.08
    limit_bar_lateral_s_curve_control_final_max_lateral_drift_m: 0.05
    limit_bar_lateral_s_curve_control_final_lateral_violation_hold_sec: 0.20
    # 路线收尾和随后趴下前全局 yaw 对齐均使用等幅反向 mode 6，平均轮速为 0。
    limit_bar_lateral_s_curve_control_final_align_norm: 0.08
    # 接管限高杆直接控制前停止 nav_executor 遗留目标；关闭可回退原行为。
    limit_bar_stop_nav_executor_on_entry_enabled: true
    # rollback: false，单独恢复上台阶旧 90deg-横移-90deg 流程。
    upstairs_lateral_s_curve_control_enabled: true
    # 上台阶首轮保持高墙提速前的保守巡航；末段和距离确认前探进一步降速。
    upstairs_lateral_s_curve_control_cruise_left_norm: 0.40
    upstairs_lateral_s_curve_control_cruise_right_norm: 0.40
    upstairs_lateral_s_curve_control_slow_left_norm: 0.25
    upstairs_lateral_s_curve_control_slow_right_norm: 0.25
    upstairs_lateral_s_curve_control_slowdown_distance_m: 0.25
    # 包含最多 0.18m 的距离确认前探，单独给上台阶 12s 看门狗。
    upstairs_lateral_s_curve_control_timeout_sec: 12.0
    upstairs_lateral_s_curve_control_max_forward_overshoot_m: 0.20
    # Tag/视觉动作线最多只能比曲线计划提前 0.25m，过滤起点附近误触发。
    upstairs_lateral_s_curve_control_distance_max_remaining_m: 0.25
    # 里程先到时若仍偏航超过 4deg，先用 mode 6 等幅反向轮速原地对正，
    # 再以 0.15 前探确认动作距离；同一轮速也用于距离锁存后的最终 1deg 对正。
    # rollback: false 可整体恢复上台阶旧流程；15.0 可恢复较晚的前探前对正门槛。
    upstairs_lateral_s_curve_control_precreep_yaw_gate_deg: 4.0
    upstairs_lateral_s_curve_control_final_align_norm: 0.08
    # 高墙候选路线仅轻微超过当前 30deg 时，不继续放宽角度上限，
    # 而是最多缩小 10% 横移量；更激进的候选仍回退旧流程。
    # rollback: false，恢复任何不可行候选都直接回退旧 90deg 流程。
    hurdle_lateral_s_curve_adaptive_clamp_enabled: true
    hurdle_lateral_s_curve_adaptive_clamp_min_scale: 0.90
    # 偏置压力测试中最大横向误差约 3.6cm、最大 yaw 跟踪误差 12.7deg，
    # 巡航由 0.40 保守提高 7.5%；末段减速和全部保护阈值保持不变。
    # rollback: cruise 恢复 0.40/0.40。
    lateral_s_curve_control_cruise_left_norm: 0.43
    lateral_s_curve_control_cruise_right_norm: 0.43
    lateral_s_curve_control_slow_left_norm: 0.25
    lateral_s_curve_control_slow_right_norm: 0.25
    lateral_s_curve_control_slowdown_distance_m: 0.25
    # 提前约 20cm 预判曲线转入/转回，减少起步近似直行和末端 yaw 滞后。
    # rollback: 0.12。
    lateral_s_curve_control_lookahead_m: 0.20
    lateral_s_curve_control_heading_gain_norm_per_rad: 0.90
    lateral_s_curve_control_cross_track_gain_rad_per_m: 1.50
    lateral_s_curve_control_cross_track_max_heading_deg: 10.0
    lateral_s_curve_control_max_delta_norm: 0.18
    # 实测 21.1deg 峰值曲线在前段出现 13.7~15.1deg 跟踪误差；18deg 内继续边走边修，
    # 超过 18deg 仍切入原地 yaw 恢复。rollback: 12.0。
    lateral_s_curve_control_walk_yaw_gate_deg: 18.0
    lateral_s_curve_control_forward_tolerance_m: 0.05
    lateral_s_curve_control_lateral_tolerance_m: 0.10
    # 视觉到线后先完全停车，让上一条走步指令的惯性释放，再判断是否需要小角度收尾。
    # 偏置实测从 6.9deg 修到 5.7deg 后因旧 6deg 容差提前结束；收紧到 3deg，
    # 让起跳前姿态落在约 2~3deg，同时保留角速度停稳和 0.30s 完成保持。
    # rollback: 6.0。
    lateral_s_curve_control_yaw_tolerance_deg: 3.0
    lateral_s_curve_control_arrival_settle_sec: 0.30
    lateral_s_curve_control_completion_hold_sec: 0.30
    # 收尾转向只允许相对到线后的最近点倒退/横漂 5cm。
    # 倒退超限时，用全正低速步态补回到最近点后 1.5cm，并在前进中继续收敛 yaw；
    # rollback: recovery_enabled=false 恢复倒退超限即停止流程。
    lateral_s_curve_control_completion_max_retreat_m: 0.05
    lateral_s_curve_control_completion_max_lateral_drift_m: 0.05
    lateral_s_curve_control_completion_recovery_enabled: true
    lateral_s_curve_control_completion_recovery_left_norm: 0.15
    lateral_s_curve_control_completion_recovery_right_norm: 0.15
    lateral_s_curve_control_completion_recovery_yaw_gain_norm_per_rad: 0.45
    lateral_s_curve_control_completion_recovery_yaw_max_delta_norm: 0.06
    lateral_s_curve_control_completion_recovery_forward_tolerance_m: 0.015
    # 倒退恢复后也不能按旧 10deg 提前结束；保留 1deg 恢复余量避免反复转向。
    # rollback: 10.0。
    lateral_s_curve_control_completion_recovery_yaw_tolerance_deg: 4.0
    lateral_s_curve_control_completion_recovery_max_extra_forward_m: 0.03
    lateral_s_curve_control_completion_recovery_max_abs_lateral_m: 0.15
    # 高墙曲线收尾不继承 overlay 中限高杆的 0.11/-0.06 大步长。
    hurdle_lateral_s_curve_final_align_independent_turn_enabled: true
    # 已经由稳定视觉近距离确认锁存起跳线后，收尾回正/倒退补偿不再用规划终点
    # 的 15cm 过冲门槛误杀流程；真实起跳线优先。仍保留 25cm 二级安全上限，
    # 横向跟踪、横漂、恢复额外前进和视觉确认保护继续生效。
    # rollback: false，恢复视觉完成后仍按规划终点 15cm 直接失败。
    hurdle_lateral_s_curve_visual_completion_ignore_plan_overshoot_enabled: true
    hurdle_lateral_s_curve_visual_completion_max_plan_overshoot_m: 0.25
    lateral_s_curve_control_timeout_sec: 8.0
    lateral_s_curve_control_max_forward_overshoot_m: 0.15
    lateral_s_curve_control_max_abs_cross_track_m: 0.20
    # 限高杆 yaw 只按全局/赛道基准角对齐；Tag 姿态 pose_pitch 不再参与 yaw。
    # Tag 仍保留为横向中心线和距离数据源。
    limit_bar_lateral_pre_align_enabled: true
    limit_bar_lateral_pre_align_mode: "fixed_absolute_yaw"
    limit_bar_lateral_pre_align_use_visual_feedback: false
    limit_bar_lateral_pre_align_timeout_sec: 8.0
    limit_bar_lateral_pre_align_max_visual_error_deg: 3.0
    limit_bar_lateral_pre_align_hold_sec: 0.15
    limit_bar_lateral_pre_align_tolerance_deg: 3.0
    limit_bar_lateral_pre_align_stop_during_hold_enabled: true
    limit_bar_lateral_pre_align_pose_control_sign: -1.0
    limit_bar_lateral_pre_align_target_pose_pitch_deg: 0.0
    # 限高杆 tag 流程接入 standalone 测试验证过的横向补偿:
    # tag/yaw 对齐后先转 90deg 横向补掉 center_x，再转回基准 yaw，
    # 前进到 tag_z 约 0.45m 后才执行趴下流程。较短的剩余距离会让实际
    # 横向路线多出约 5cm 前进段，降低短距离几何的峰值曲率，同时让趴下点前移。
    # rollback: 恢复为 0.50，回到旧的趴下触发距离。
    limit_bar_lateral_shift_enabled: true
    limit_bar_lateral_shift_yaw_deg: 90.0
    limit_bar_lateral_shift_yaw_sign: -1.0
    limit_bar_lateral_shift_deadband_m: 0.06
    # 触发死区只决定是否需要横移；到达容差独立决定横移何时结束。
    # 回退旧行为：改回与 deadband_m 相同的 0.06。
    limit_bar_lateral_shift_arrival_tolerance_m: 0.025
    # 不再按较大的横偏阈值跳过 90 度横移；仅保留 deadband_m 过滤极小抖动。
    limit_bar_lateral_shift_skip_below_m: 0.00
    limit_bar_lateral_shift_distance_scale: 1.00
    limit_bar_lateral_shift_max_distance_m: 0.95
    limit_bar_lateral_shift_target_distance_m: 0.42
    limit_bar_lateral_shift_walk_mode: 0
    limit_bar_lateral_shift_walk_left_norm: 0.50
    limit_bar_lateral_shift_walk_right_norm: 0.50
    limit_bar_lateral_shift_use_euclidean_progress: false
    limit_bar_lateral_shift_final_yaw_gate_deg: 6.0
    limit_bar_lateral_shift_duck_entry_yaw_gate_deg: 2.0
    limit_bar_lateral_shift_duck_entry_hold_sec: 0.30
    # 最终前进完成后继续沿用 Tag 预对齐、横移回正和最终前进共用的 base_yaw，
    # 避免本次从 160.9deg 再错误切到绝对 180deg。route_zero_plus_offset 可恢复
    # “运行时赛道 0deg + 180deg”，无运行时基准时回退绝对 180deg。
    limit_bar_pre_duck_global_yaw_align_enabled: true
    limit_bar_pre_duck_yaw_reference_mode: "base_yaw"
    limit_bar_pre_duck_global_yaw_deg: 180.0
    # 实测 mode 6 在 180deg 附近约有 +/-5deg 摆动；6deg 内先零速锁定，避免
    # 为追求 1deg 精度持续反向修正；锁定后超过 8deg 才重新转向。
    limit_bar_pre_duck_global_yaw_tolerance_deg: 6.0
    limit_bar_pre_duck_global_yaw_exit_tolerance_deg: 8.0
    limit_bar_pre_duck_global_yaw_hold_sec: 0.10
    limit_bar_pre_duck_global_yaw_timeout_sec: 6.0
    # rollback: false，恢复 yaw 对齐超时失败。
    limit_bar_pre_duck_global_yaw_fail_open_enabled: true
    # 旧横移回退和实际 S 曲线统一用等幅 mode 6 原地对正；关闭开关可恢复 overlay
    # 中 -0.060/+0.110 的非对称转向。
    limit_bar_pre_duck_stationary_turn_enabled: true
    limit_bar_pre_duck_stationary_turn_norm: 0.08
    # 横向补偿/最终前进走步时，继续用 Odometry 压住 yaw，避免斜向横移后过冲到 50deg+。
    limit_bar_lateral_shift_walk_yaw_correction_enabled: true
    limit_bar_lateral_shift_walk_yaw_deadband_deg: 1.5
    limit_bar_lateral_shift_walk_yaw_gain_norm_per_rad: 0.90
    limit_bar_lateral_shift_walk_yaw_max_delta_norm: 0.18
    limit_bar_lateral_shift_duck_align_ccw_left_norm: -0.040
    limit_bar_lateral_shift_duck_align_ccw_right_norm: 0.080
    limit_bar_lateral_shift_duck_align_cw_left_norm: 0.080
    limit_bar_lateral_shift_duck_align_cw_right_norm: -0.040

    # 新版高墙/横栏入口：用右侧 AprilTag 触发并复用限高杆横向补偿流程；
    # 横向/前向补偿完成后进入原 HURDLE_WAIT_JUMP 起跳流程，不进入趴行。
    # rollback: hurdle_visual_trigger_enabled=true, hurdle_tag_trigger_enabled=false。
    hurdle_visual_trigger_enabled: false
    hurdle_tag_trigger_enabled: true
    # 横栏 tag 实际使用 ID31 / hurdle_right；尺寸在 tags_36h11.yaml 中配置为 0.110m。
    hurdle_tag_target_tag_id: 31
    hurdle_tag_frame_id: "camera_color_optical_frame"
    hurdle_tag_child_frame_id: "hurdle_right"
    # 横栏 tag 右侧边缘到中心线向右收 8cm，降低过度左修导致的实际左偏。
    hurdle_tag_to_center_x_m: -0.360
    # 横栏起跳前比限高杆多往前走 5cm: 0.45m -> 0.40m tag 保持距离。
    hurdle_lateral_shift_target_distance_m: 0.50
    # 高墙横向补偿方向保持原方向；幅度用下方高墙独立 scale 收小。
    hurdle_lateral_shift_yaw_sign: -1.0
    # 高墙横移距离独立缩放，避免复用限高杆 1.00 时横移过量。
    hurdle_lateral_shift_distance_scale: 0.65
    # 高墙 tag 横偏 <=6cm 时视为正中，避免视觉/贴码小误差触发不必要横移。
    hurdle_lateral_shift_deadband_m: 0.10
    # 回退旧行为：改回 0.10。
    hurdle_lateral_shift_arrival_tolerance_m: 0.03
    # 高墙最终前进使用独立完成容差，避免复用 10cm 横向死区而过早停止。
    hurdle_final_forward_tolerance_m: 0.05
    # 仅供 S 曲线不可行时的高墙旧 90deg 回退流程使用：转回基准角后，
    # 用新鲜 Tag/视觉重新计算剩余直行，只允许缩短原计划且单次最多缩短 0.30m。
    # rollback: 关闭 relock 开关即可恢复转弯前一次性锁定的 final_forward。
    hurdle_lateral_shift_legacy_relock_final_forward_enabled: true
    hurdle_lateral_shift_legacy_relock_visual_cap_enabled: true
    hurdle_lateral_shift_legacy_relock_min_tag_samples: 2
    hurdle_lateral_shift_legacy_relock_max_reduction_m: 0.30
    # 回退旧流程的最后 0.25m 降至 0.25 步速，避免视觉短时丢帧时仍以 0.50 冲过停止线。
    # slowdown=0 可单独恢复旧全速；overshoot=0 可关闭里程硬保护。
    hurdle_lateral_shift_legacy_slowdown_distance_m: 0.25
    hurdle_lateral_shift_legacy_slow_left_norm: 0.25
    hurdle_lateral_shift_legacy_slow_right_norm: 0.25
    hurdle_lateral_shift_legacy_max_forward_overshoot_m: 0.10
    # 高墙 final_forward 期间若视觉最近距离已到起跳线，则不再继续等 odom 计划距离走满。
    hurdle_lateral_shift_visual_jump_enabled: true
    # 相对 0.50m Tag 规划目标提前 5cm 停车，给视觉帧/回调/制动留余量；
    # rollback: 0.65（实测约在 0.60~0.64m 进入起跳等待）。
    hurdle_lateral_shift_visual_jump_distance_m: 0.55
    hurdle_lateral_shift_visual_jump_max_age_sec: 0.50
    hurdle_lateral_shift_visual_jump_yaw_gate_deg: 6.0
    # S 曲线实际控制不接受单帧近距离：连续 3 帧或保持 0.15s，且最多只能比
    # 里程计划提前 0.35m；有新鲜 Tag 时，视觉/Tag 距离差还必须不超过 0.40m。
    # 不满足时仅忽略该视觉候选并继续曲线，不进入 FAILED。
    # rollback: samples=1, duration=0, max_remaining=0, tag_max_delta=0。
    hurdle_lateral_s_curve_visual_jump_confirm_samples: 3
    hurdle_lateral_s_curve_visual_jump_confirm_duration_sec: 0.15
    hurdle_lateral_s_curve_visual_jump_max_remaining_m: 0.35
    hurdle_lateral_s_curve_visual_jump_tag_max_delta_m: 0.40
    # 高墙 tag 稳定策略对齐限高杆：3 帧可用，短时丢码后由 odom 接力到触发线。
    hurdle_tag_stale_timeout_sec: 0.50
    hurdle_tag_min_samples: 1
    hurdle_tag_max_sample_age_sec: 0.50
    # 保留原 /tf 回调；高墙样本过期时，使用 tf2 Buffer 非阻塞查询最新 hurdle_right。
    hurdle_tf_buffer_fallback_enabled: true
    hurdle_tag_trigger_distance_m: 1.70
    hurdle_tag_odom_handoff_enabled: true
    hurdle_tag_odom_handoff_timeout_sec: 2.0
    hurdle_tag_odom_handoff_max_start_distance_m: 2.00
    hurdle_tag_slope_guard_enabled: true
    hurdle_tag_slope_guard_distance_m: 1.85
    # 高墙标称角仍为 0deg；收到运行时赛道 0deg 后目标变为 route_zero+0deg。
    # tag 仍负责触发、距离、横向锁定和丢码 odom 接力。
    hurdle_tag_yaw_reference_mode: "fixed_absolute"
    hurdle_tag_fixed_reference_yaw_deg: 0.0
    # 高墙角度预对齐独立参数：不读取 tag pose_pitch / tag 横偏生成 yaw 修正角；
    # 有运行时赛道基准时使用 route_zero+0deg，否则回退绝对 0deg。
    hurdle_lateral_pre_align_enabled: true
    hurdle_lateral_pre_align_mode: "fixed_absolute_yaw"
    # 固定绝对 yaw 模式下只用 odom yaw 收敛到 0deg，tag 仍用于触发/距离/横向锁定。
    hurdle_lateral_pre_align_use_visual_feedback: false
    hurdle_lateral_pre_align_timeout_sec: 8.0
    hurdle_lateral_pre_align_max_visual_error_deg: 0.0
    hurdle_lateral_pre_align_hold_sec: 0.10
    # S 曲线可在行走中吸收少量初始 yaw；3deg 内停车保持 0.10s 后直接起步。
    hurdle_lateral_pre_align_tolerance_deg: 3.0
    # 修复容差保持期间仍发送旋转指令的问题，并使用高墙独立低速步长。
    hurdle_lateral_pre_align_stop_during_hold_enabled: true
    hurdle_lateral_pre_align_independent_turn_enabled: true
    hurdle_fine_yaw_turn_ccw_left_norm: -0.04
    hurdle_fine_yaw_turn_ccw_right_norm: 0.08
    hurdle_fine_yaw_turn_cw_left_norm: 0.08
    hurdle_fine_yaw_turn_cw_right_norm: -0.04
    hurdle_fine_yaw_turn_min_scale: 0.50
    hurdle_fine_yaw_turn_full_error_deg: 10.0
    hurdle_lateral_pre_align_pose_control_sign: -1.0
    hurdle_lateral_pre_align_target_pose_pitch_deg: 0.0

    duck_prepare_mode: 2
    duck_prepare_left_norm: 0.0
    duck_prepare_right_norm: 0.0
    # 限高杆前自旋/对齐结束后，先发一小段 [0,0,0] 彻底刹停，再切到 [2,0,0] 趴下。
    duck_prepare_stop_buffer_sec: 0.0
    # 2026-07-10: 关闭趴下后的固定停顿，发送一次 [2,0,0] 后立即切入趴走。
    duck_prepare_delay_sec: 0.0
    # 关闭趴下后的额外 yaw 停稳阶段，避免进入趴走前再次停顿 0.3~2.0s。
    limit_bar_duck_prepare_yaw_settle_enabled: false
    limit_bar_duck_prepare_yaw_tolerance_deg: 1.0
    limit_bar_duck_prepare_yaw_hold_sec: 0.30
    limit_bar_duck_prepare_yaw_timeout_sec: 2.0
    limit_bar_duck_prepare_yaw_mode: 2
    limit_bar_duck_prepare_yaw_cw_left_norm: 0.26
    limit_bar_duck_prepare_yaw_cw_right_norm: 0.12
    limit_bar_duck_prepare_yaw_ccw_left_norm: 0.12
    limit_bar_duck_prepare_yaw_ccw_right_norm: 0.26
    duck_walk_mode: 2
    # 2026-05-24: 趴走阶段左右漂移不是固定方向，避免加单侧偏置；对称降速降低随机打滑。
    # rollback: 两侧改回 1.0。
    duck_walk_left_norm: 0.90
    duck_walk_right_norm: 0.90
    duck_resume_mode: 0
    duck_resume_left_norm: 0.0
    duck_resume_right_norm: 0.0
    duck_resume_delay_sec: 1.0
    # 2026-05-24: 限高杆触发距离提前到约 1.05m 后，0.95m 趴走会偏早站起；
    # 加长实际通过距离，确保机身完全越过限高杆。
    # rollback: 改回 0.95。
    duck_travel_distance_m: 1.12
    # 趴走完成只按锁存 yaw 方向上的 Odometry 投影距离判断；
    # 不启用下方中心线横偏控制，左右腿仍使用原 yaw 修正逻辑。
    duck_travel_projection_enabled: true
    duck_travel_timeout_sec: 14.0  # 防止 Odometry 判定异常时无限趴走；超时后先站起停止
    duck_progress_log_interval_sec: 1.0
    duck_travel_delta_x_m: 0.0    # 兼容旧参数；duck_travel_distance_m <= 0 时才用 delta 向量长度
    duck_travel_delta_y_m: 0.78
    duck_travel_max_x_error_m: 0.35  # 兼容旧参数；当前实际距离判断不再使用横向误差门限
    # 趴走结束站起后，再按限高杆锁定的 yaw 基准复对齐一次，抵消趴下->站立转换带来的角度变化。
    limit_bar_post_resume_yaw_align_enabled: true
    limit_bar_post_resume_yaw_tolerance_deg: 1.0
    limit_bar_post_resume_yaw_hold_sec: 0.30
    limit_bar_post_resume_yaw_timeout_sec: 2.0
    # 低杆分支先复用斜坡前 yaw 对齐逻辑：原地停住做 yaw 对齐，再进入 [2,0,0] 趴下等待。
    duck_pre_align_enabled: true
    # 2026-06-26: 进入限高杆分支时，不再只锁存当前 yaw；如果最近限高杆
    # nearest 新鲜且有 lateral/distance，就先按 atan2(lateral, distance) 修正
    # yaw 基准，让狗子先正对限高杆中心再趴走。若 nearest 无效则回退当前 yaw。
    duck_visual_yaw_align_enabled: false
    duck_visual_yaw_lateral_sign: -1.0
    duck_visual_yaw_max_offset_deg: 20.0
    duck_visual_yaw_stale_timeout_sec: 0.75
    duck_visual_yaw_min_distance_m: 0.20
    # 限高杆分支锁存视觉对中后的 yaw，后续趴下等待/趴走都按这条基准线做小幅差速修正。
    # 语义对齐 obstacle_manager 的 direct_step_yaw_correction：
    # delta = gain * max(0, |yaw_err|-tolerance)，再按 sign 决定左右腿修正方向。
    duck_yaw_correction_enabled: true
    # 2026-06-09: 实测限高杆前半段 7~11deg 误差时修正手感合适，但收进 3~5deg 后
    # yaw_corr 会从 0.58 掉到 0.30 左右，现场看仍有点歪。把死区收紧到 0.2deg，
    # 让小残差阶段继续保持明显修正。
    # 2026-06-09: 固定按锁存 yaw 修正，不再使用最后一帧 camera TF 当实时误差。
    duck_yaw_correction_tolerance_deg: 0.5
    # 2026-06-09: 对齐 crouch_yaw_settle 的强回正风格。
    # 低杆分支仍然是“固定时长 prepare + 通过时继续修”，不是 waypoint 那种
    # “收进阈值才切下一段”，所以这里先复用同级别 gain/max_delta，让修正更明显。
    duck_yaw_correction_gain_per_rad: 1.20
    # 2026-07-10: 限制趴走最大差速，避免 1deg 左右小误差触发过强转向并反复过冲。
    duck_yaw_correction_max_delta_norm: 0.25
    # 按 yaw 误差比例输出修正，不再在超过死区后直接使用最大差速。
    duck_yaw_correction_force_max_delta: false
    duck_yaw_correction_sign: 1.0
    # 若已用限高杆 AprilTag 锁定通行中心线，趴走阶段只用 Odometry 对中心线做
    # along/lateral/yaw 修正，不再使用最后一帧 camera TF 当实时误差。
    duck_centerline_correction_enabled: false
    duck_centerline_lateral_gain_norm_per_m: 0.80
    duck_centerline_yaw_gain_norm_per_rad: 0.80
    duck_centerline_deadband_m: 0.03
    duck_centerline_yaw_deadband_deg: 1.0
    duck_centerline_max_delta_norm: 0.25
    duck_centerline_lateral_fail_m: 0.45
    duck_centerline_yaw_fail_deg: 30.0
    # 雷达/里程计平面坐标约定：当前底盘 x 向右、y 向前。
    # 因此趴走中心线 along/lateral 计算必须以 y 作为前进轴。
    duck_centerline_odom_forward_axis: "y"

    hurdle_stand_mode: 0
    hurdle_stand_left_norm: 0.0
    hurdle_stand_right_norm: 0.0
    hurdle_jump_mode: 4
    hurdle_jump_left_norm: 0.0
    hurdle_jump_right_norm: 0.0
    hurdle_stand_to_jump_delay_sec: 0.4  # 识别横栏后持续停住，短暂停稳后尽快起跳，避免继续顶到横梁
    hurdle_jump_to_walk_delay_sec: 3.0  #跳完之后等待的时间
    # 2026-05-28: 高墙跳跃用 /serial_step_once，现场可能丢单帧包；
    # 重复发送 5 次 mode=4，确保电控收到跳跃触发。
    # rollback: 改回 1。
    hurdle_jump_step_once_repeat_count: 5
    hurdle_jump_step_once_repeat_interval_sec: 0.08
    # 高墙跳完落地后，只拉回进入高墙分支前锁住的 yaw，不再使用启动 yaw。
    # 若没有锁住入口 yaw，则用当前 yaw 原地判定，避免错误大角度回转。
    # 正角度为逆时针，负角度为顺时针；超时先放行，避免现场卡死。
    hurdle_post_align_enabled: true
    hurdle_post_align_use_startup_yaw: false
    hurdle_post_align_target_yaw_deg: 0.0
    hurdle_post_align_tolerance_deg: 2.0
    hurdle_post_align_exit_hold_sec: 0.20
    hurdle_post_align_timeout_sec: 3.0
    hurdle_post_align_timeout_action: "advance"
    hurdle_post_align_mode: 6
    hurdle_post_align_ccw_left_norm: -0.12
    hurdle_post_align_ccw_right_norm: 0.28
    hurdle_post_align_cw_left_norm: 0.28
    hurdle_post_align_cw_right_norm: -0.12
    hurdle_post_align_fine_threshold_deg: 6.0
    hurdle_post_align_fine_ccw_left_norm: -0.08
    hurdle_post_align_fine_ccw_right_norm: 0.20
    hurdle_post_align_fine_cw_left_norm: 0.20
    hurdle_post_align_fine_cw_right_norm: -0.08
    hurdle_post_align_hold_mode: 0
    hurdle_post_align_hold_left_norm: 0.0
    hurdle_post_align_hold_right_norm: 0.0
    upstairs_step_once_mode: 5
    upstairs_step_once_left_norm: 0.0
    upstairs_step_once_right_norm: 0.0
    # 上台阶 [5,0,0] 发出后，若 1s 内未收到电控 [jumping]/[finish] 回包，
    # 则继续在 DONE 停止保持中重发，最多重发 3 次。
    upstairs_step_once_resend_after_sec: 1.0
    upstairs_step_once_resend_max_count: 3

    # 斜坡分支识别源：
    # - slope_visual_detection_enabled=false 时，supervisor 完全忽略 slope_branch_detector 的 trigger。
    # - slope_roll_detection_enabled=true 时，用 Odometry roll 判定已经上斜坡。
    # rollback: slope_visual_detection_enabled=true, slope_roll_detection_enabled=false。
    slope_visual_detection_enabled: false
    slope_roll_detection_enabled: true
    slope_roll_detection_deg: 8.0
    slope_roll_detection_use_abs: true
    # 首帧越过 8deg 后锁存计时；后续短暂回落不清零，累计 0.50s 直接触发。
    slope_roll_detection_hold_sec: 0.50
    slope_roll_detection_post_stairs_only: true
    # 关闭超时兜底，避免随机障碍是横梁/限高杆时搜索刚开始就抢进斜坡分支。
    slope_fallback_enabled: false
    slope_fallback_timeout_sec: 10.0
    slope_fallback_min_distance_m: 0.0  #判定距离

    # 进入斜坡分支前，先把下楼梯后随机偏掉的 yaw 拉回启动时的基准 yaw，
    # 再让 body_relative 斜坡 waypoint 锁定目标，避免第二点继承错误朝向。
    slope_align_enabled: true
    # 2026-07-09: 保留下楼梯后的 post_stairs yaw 对齐，但 roll/视觉识别到斜坡后
    # 不再进入第二次 SLOPE_ALIGN，直接进入斜坡分支。
    # rollback: 改回 true。
    slope_align_on_detected_branch_enabled: true
    slope_align_use_startup_yaw: false
    slope_align_target_yaw_deg: 0.0
    # 直驱上斜坡前只需要把大偏航拉回到大致正向。容差过紧会继续 mode=6
    # 自旋，实测容易在坡前把 Odometry yaw 带到 -70deg，随后被 waypoint yaw 守门拦住。
    slope_align_tolerance_deg: 1.5
    slope_align_exit_hold_sec: 0.50
    slope_align_timeout_sec: 5.0
    slope_align_timeout_action: "advance"
    slope_align_mode: 6
    slope_align_ccw_left_norm: -0.12
    slope_align_ccw_right_norm: 0.28
    slope_align_cw_left_norm: 0.28
    slope_align_cw_right_norm: -0.12
    slope_align_fine_threshold_deg: 6.0
    slope_align_fine_ccw_left_norm: -0.05
    slope_align_fine_ccw_right_norm: 0.10
    slope_align_fine_cw_left_norm: 0.10
    slope_align_fine_cw_right_norm: -0.05
    slope_align_hold_mode: 0
    slope_align_hold_left_norm: 0.0
    slope_align_hold_right_norm: 0.0

    # 普通版和 mirror 共用运行时角度恢复。回退时只需改为 false：
    # supervisor 恢复旧斜坡重试，waypoint 新角度模式按各自 fallback_mode 恢复旧语义。
    slope_retry_runtime_yaw_reference_enabled: true
    slope_retry_standard_waypoints_basename: "obstacle_waypoints.yaml"
    slope_retry_mirror_waypoints_basename: "obstacle_waypoints_mirror.yaml"
    # 桥前重试：锁存收到 [start] 时的 yaw 为赛道 0deg，停用 slope_manager，
    # 返回普通 SEARCH 并恢复全部障碍物仲裁；若重新识别为斜坡，则从 platform_center 启动。
    # rollback: 改回 true，即恢复只接受 slope/roll 的保护搜索。
    slope_retry_rezero_search_only_slope: false
    slope_retry_rezero_rearm_delay_sec: 0.30
    # 同一轮比赛只允许第一次桥前重试改写赛道 0deg；后续桥前重试复用该基准。
    slope_retry_route_rezero_once: true
    # 桥区前 3 次重试都从 turn_180_yaw_settle 重跑并正常经过木桥；
    # 第 4 次及以后从当前路线对应的 bridge_exit_*_spin 续跑，跳过再次过桥。
    slope_bridge_full_route_retry_count: 3
    slope_retry_pre_bridge_waypoints:
      - platform_center
      - platform_center_spin
      - crouch_yaw_settle
      - wall_jump_prep
    # 桥区重试判定范围（包含首尾）：从站立后绝对角对齐点开始，
    # 到第一次下坡中段自旋点结束。前 3 次重试均锁存当前 yaw 并从
    # turn_180_yaw_settle 重跑；
    # bridge_exit 的前进距离由 waypoint 运行时覆盖为当前配置的 1.20m。
    # 第 4 次及后续桥区重试更新锁存 yaw，并从当前路线对应的 bridge_exit_*_spin 续跑。
    # 位置 anchor 不做任何改写；新一轮比赛会清零桥区重试计数。
    slope_retry_bridge_waypoints:
      - wall_post_stand_yaw_align
      - turn_180_spin
      - turn_180_yaw_settle
      - bridge_tag_yaw_lock
      - bridge_apriltag_lateral_precheck
      - bridge_entry
      - bridge_exit
      - bridge_exit_ccw_45_spin
      - bridge_exit_cw_45_spin_mirror
      - final_descent_approach
      - final_descent_mid_spin
      - final_descent_mid_spin_mirror
    # final_descent_mid_spin（含 mirror）之后已离开桥区；后续点收到重试不再回木桥，
    # 直接停用 slope_manager、重置斜坡完成标志并返回通用 SEARCH。
    slope_retry_search_waypoints:
      - final_descent_second_approach
      - final_descent_second_spin
      - final_descent_second_spin_mirror
      - final_descent_second_spin_extra_approach
      - final_descent_second_spin_extra_spin
      - final_descent_third_approach
      - final_heading_align

    # 下楼梯后先做 yaw 对齐，再按里程计固定前进一小段。
    post_stairs_slope_entry_enabled: true
    # 走完这段固定距离后不在入口处停住确认，而是转入 SEARCH，让真实检测结果决定分支。
    post_stairs_slope_entry_distance_m: 0.00
    post_stairs_slope_entry_timeout_sec: 8.0
    post_stairs_slope_entry_mode: 0
    post_stairs_slope_entry_left_norm: 0.5
    post_stairs_slope_entry_right_norm: 0.5
    # 当前场地楼梯结束时赛道正向约为 camera_init 180deg；固定对齐绝对 0deg
    # 会在限高杆已经位于前方时错误转近半圈。暂时关闭，0m 入口下一周期直接进 SEARCH。
    # rollback: true，恢复独立于 slope_align_enabled 的楼梯后强制 yaw 对齐。
    post_stairs_slope_entry_initial_yaw_align_enabled: true
    post_stairs_slope_entry_yaw_correction_enabled: true
    post_stairs_slope_entry_yaw_tolerance_deg: 2.0
    post_stairs_slope_entry_yaw_gain_norm_per_rad: 0.8
    post_stairs_slope_entry_yaw_max_delta_norm: 0.12
    post_stairs_slope_entry_finish_yaw_realign_threshold_deg: 1.0
    post_stairs_slope_search_after_entry: true
    # 2026-06-15: 走完固定 0.20m 后直接进入 SEARCH 并立刻允许新检测分支，
    # 不再原地停住等 confirm_timeout_sec。
    post_stairs_slope_search_rearm_delay_sec: 0.0
    # 楼梯后固定入口搜索阶段，斜坡视觉 ready 时优先级高于限高杆/横栏/绕杆。
    # 当前默认关闭斜坡视觉，因此这项只作为回视觉方案的保留开关。
    post_stairs_slope_priority_enabled: true
    # 旧的楼梯后专用 roll priority 已由上面的通用 slope_roll_detection_* 取代。
    post_stairs_slope_roll_priority_enabled: false
    post_stairs_slope_roll_priority_deg: 8.0
    post_stairs_slope_roll_priority_use_abs: true
    post_stairs_slope_roll_priority_hold_sec: 0.10
    # 仅当 post_stairs_slope_search_after_entry=false 时，下面的 confirm_* 参数才会生效。
    post_stairs_slope_confirm_required: false
    post_stairs_slope_confirm_timeout_sec: 2.2
    # 确认阶段只在斜坡真正稳定触发时进斜坡；若超时仍不确定，返回 SEARCH 让后续
    # 横栏/限高杆/绕杆继续按自身检测分支，避免把随机障碍硬判成斜坡。
    # rollback: 改回 "advance" 即固定入口确认超时后默认进入斜坡分支。
