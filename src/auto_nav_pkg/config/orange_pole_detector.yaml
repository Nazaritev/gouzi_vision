# 2026-05-03 01:05 CST
# Purpose: lightweight D435 RGB+aligned-depth pole localization for right-angle
# pole obstacle tests on a CPU-only mini PC.
# Rollback: do not launch orange_pole_detector_test.launch.py; use the existing
# YOLO launch and yolo_relative_nav pipeline instead.

orange_pole_detector:
  ros__parameters:
    color_topic: "/camera/color/image_raw"
    depth_topic: "/camera/aligned_depth_to_color/image_raw"
    camera_info_topic: "/camera/color/camera_info"

    nearest_topic: "/orange_pole_detector/nearest"
    nearest_pose_topic: "/orange_pole_detector/nearest_pose"
    trigger_topic: "/orange_pole_detector/trigger"
    feedback_topic: "/orange_pole_detector/feedback_log"
    debug_image_topic: "/orange_pole_detector/debug_image"

    # 2026-05-03 01:05 CST: initial HSV range for orange poles under D435 RGB.
    # Tune these on site with rqt_image_view if the venue light shifts.
    # Rollback: widen to [0,50,50]-[45,255,255] if poles are missed.
    hsv_lower: [5, 70, 70]
    # 2026-05-17: 地面黄线偏黄，收窄 H 上限降低黄线进入 mask 的概率。
    # rollback: 改回 [35,255,255]。
    hsv_upper: [30, 255, 255]

    min_area_px: 120.0
    min_height_px: 45
    # 2026-05-17: 限高杆场景出现 12px 宽橘色细条误触发绕杆(box=12x127)；
    # 先过滤过窄候选。若真实绕杆远距离漏检，rollback: 改回 4。
    min_width_px: 14
    max_width_px: 260
    # 斜坡后误触发日志里的假杆在画面左上方，底边 y 约 113px/480。
    # 真正落地竖杆底边通常更低；这个门限过滤高处橘色碎块。
    min_bottom_y_ratio: 0.32
    min_aspect_ratio: 1.8
    morph_kernel_px: 5

    depth_units_divisor: 1000.0
    min_depth_m: 0.20
    max_depth_m: 3.00
    min_valid_depth_pixels: 8
    # 2026-05-03 01:29 CST: 现场日志显示距离偏差约 7-8cm。
    # 对细杆，mask 边缘容易混入背景深度；先腐蚀用于测距的 mask，
    # 再取近侧 25 分位，通常比整块中位数更接近杆面。
    # 回退点：depth_mask_erode_px: 0, depth_percentile: 50.0。
    depth_mask_erode_px: 3
    depth_percentile: 25.0
    # 现场用卷尺校准后填写固定偏置；例如稳定偏大 7cm 就设 -0.07。
    distance_bias_m: 0.0
    depth_stale_timeout_sec: 0.50
    camera_info_stale_timeout_sec: 5.0
    # 2026-05-22: 区分启动初期“深度流还没起来”和持续未接通。
    # 超过该时间仍未收到 aligned depth，就把日志升级为 warn 并带上 topic 名。
    depth_wait_warn_after_sec: 2.0

    # 2026-05-03 03:24 CST: current src/点位.txt uses point 1 as the route
    # start point. Field logs showed a 1.42m frame followed by a much closer
    # frame, so trigger at 1.45m to reduce anchor lag on the CPU-only camera
    # pipeline. Rollback: restore 1.35 if the robot starts too early.
    trigger_distance_m: 1.45
    publish_debug_image: true
    log_interval_sec: 1.0

    # D435 is mounted about 23cm above ground. The optional ground filter is
    # disabled by default because camera pitch changes this projection.
    camera_height_m: 0.23
    use_ground_height_filter: false
    ground_height_tolerance_m: 0.18
    # 2026-05-17: 过滤地面黄/橘色线。地面线在透视下可能形成高瘦框，
    # 但上下两端的 3D 高度差很小；真正竖杆应有明显离地高度。
    # rollback: use_physical_height_filter: false。
    use_physical_height_filter: true
    min_physical_height_m: 0.12
    physical_height_band_ratio: 0.25
    physical_height_min_valid_pixels: 3
