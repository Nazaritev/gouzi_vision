upstairs_detector:
  ros__parameters:
    color_topic: "/camera/color/image_raw"
    depth_topic: "/camera/aligned_depth_to_color/image_raw"
    camera_info_topic: "/camera/color/camera_info"

    nearest_topic: "/upstairs_detector/nearest"
    trigger_topic: "/upstairs_detector/trigger"
    feedback_topic: "/upstairs_detector/feedback_log"
    state_topic: "/upstairs_detector/state"
    debug_image_topic: "/upstairs_detector/debug_image"

    # 上台阶为固定绿色。bag rosbag2_2026_06_13-21_03_27 中：
    # - 从下往上第 1 条绿色深度带约 0.62m
    # - 从下往上第 2 条绿色深度带约 0.95m，对应第二节台阶
    # - 从下往上第 3 条绿色深度带约 1.28m
    hsv_lower: [30, 40, 30]
    hsv_upper: [100, 255, 255]
    morph_open_kernel_px: 5
    morph_close_kernel_px: 0
    morph_close_iterations: 1
    search_y_min_px: 160
    search_y_max_px: 470
    row_min_green_ratio: 0.30
    row_min_valid_depth_pixels: 80
    depth_split_threshold_m: 0.16
    max_row_gap_px: 3
    target_band_from_bottom: 1
    min_band_height_px: 14
    min_band_width_px: 180
    min_band_area_px: 2500
    max_abs_lateral_m: 1.50
    depth_units_divisor: 1000.0
    min_depth_m: 0.20
    max_depth_m: 3.00
    depth_percentile: 50.0
    distance_bias_m: 0.0
    # 与 supervisor 的无 Tag 视觉兜底距离对齐，相对上一版 0.620m 向前 1cm。
    trigger_distance_m: 0.610
    trigger_hold_sec: 0.20
    depth_stale_timeout_sec: 0.50
    camera_info_stale_timeout_sec: 5.0

    publish_debug_image: true
    log_interval_sec: 1.0
