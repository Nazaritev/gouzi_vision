  - name: final_descent_third_approach
    target_type: body_relative
    body_forward_m: 1.90
    body_left_m: 0.00
    body_yaw_delta_deg: 0.0
    frame_id: camera_init
    mode_on_arrival: 0
    path_correction_profile_on_arrival: 2
    mode_hold_sec: 0.0
    post_arrival_pause_sec: 0.10
    arrival_tolerance: 0.30
    distance_arrival_enabled: false
    travel_distance_arrival_enabled: true
    allow_goal_pass_through: false
    pass_through_lateral_tolerance: 1.20
    pass_through_force_progress_ratio: 1.05
    smooth_transition: false
    mode_wait_for_done: true
    mode_done_timeout_sec: 1.50
    use_direct_step_override: true
    publish_path_reference_for_direct_step_override: true
    publish_path_reference_start_for_direct_step_override: true
    path_reference_start_source: anchor
    direct_step_override_mode: 7
    direct_step_override_left_norm: 0.80
    direct_step_override_right_norm: 1.00
    # 2026-06-26: field log showed this segment drifting from yaw_err=0.1deg
    # to 17.8deg while fixed [7,0.500,0.700] kept adding positive step_yaw.
    # Add a bounded yaw correction on top of the fixed downhill gait so the
    # segment can cancel accumulated heading error before final_heading_align.
    # Rollback: set direct_step_yaw_correction_enabled=false.
    direct_step_yaw_correction_enabled: true
    direct_step_yaw_correction_tolerance_deg: 2.0
    direct_step_yaw_correction_gain_per_rad: 0.45
    direct_step_yaw_correction_max_delta_norm: 0.18
    direct_step_yaw_correction_sign: 1.0
    note: "普通最终位置第三段接近点：mode=7，left=0.50,right=0.70，固定直驱前进并叠加小幅姿态修正；本点只按起点到当前 pose 的净位移达到 body_forward_m 判定到点，随后进入最终朝向点。"

  - name: final_heading_align
    target_type: body_relative
    body_forward_m: 0.00
    body_left_m: 0.00
    body_yaw_mode: waypoint_arrival
    body_yaw_waypoint: bridge_entry
    # 第四次及后续桥区重试会从 bridge_exit_ccw_45_spin 续跑，并清除之前的到点记录。
    # 此时若没有 bridge_entry 到点 yaw，使用最近一次桥区重试信号锁存的 yaw 完成最终对齐。
    body_yaw_waypoint_fallback_to_bridge_retry_reference: true
    body_reference_yaw_source: target_yaw
    frame_id: camera_init
    mode_on_arrival: 0
    path_correction_profile_on_arrival: 0
    post_arrival_pause_sec: 0.0
    arrival_tolerance: 0.24
    use_yaw_tolerance: true
    yaw_tolerance_deg: 3.0
    allow_goal_pass_through: false
    smooth_transition: false
    use_direct_step_override: true
    direct_step_override_mode: 6
    direct_step_override_left_norm: 0.0
    direct_step_override_right_norm: 0.0
    direct_step_yaw_direction_override_enabled: true
    direct_step_yaw_direction_tolerance_deg: 1.5
    direct_step_yaw_direction_cw_left_norm: 0.40
    direct_step_yaw_direction_cw_right_norm: -0.20
    direct_step_yaw_direction_ccw_left_norm: -0.20
    direct_step_yaw_direction_ccw_right_norm: 0.40
    note: "普通最终朝向调整点：不再写死角度，引用 bridge_entry 到点时的实际 yaw；2026-07-06 日志显示 yaw_err<0 时 [-0.20,0.40] 会越修越大，改为 yaw_err<0 用 [0.40,-0.20]，yaw_err>0 用 [-0.20,0.40]。"
